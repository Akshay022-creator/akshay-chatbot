<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6851ff"/>
      <stop offset="100%" stop-color="#8a7bff"/>
    </linearGradient>
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#e7e7ee"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>

  <!-- background -->
  <circle cx="100" cy="100" r="100" fill="url(#bgGrad)"/>

  <g clip-path="url(#circleClip)">
    <!-- amber accent glow -->
    <circle cx="160" cy="35" r="55" fill="#e79a1a" opacity="0.25"/>

    <!-- shoulders / shirt -->
    <path d="M 30 210 Q 40 145 100 140 Q 160 145 170 210 Z" fill="url(#shirtGrad)"/>
    <path d="M 30 210 Q 40 145 78 140 L 70 165 Q 45 175 38 210 Z" fill="#dcdce6"/>

    <!-- neck -->
    <rect x="86" y="118" width="28" height="30" rx="10" fill="#c98a5e"/>

    <!-- head -->
    <ellipse cx="100" cy="92" rx="42" ry="46" fill="#dba172"/>

    <!-- ears -->
    <ellipse cx="59" cy="94" rx="7" ry="10" fill="#dba172"/>
    <ellipse cx="141" cy="94" rx="7" ry="10" fill="#dba172"/>

    <!-- hair -->
    <path d="M 56 90
             Q 50 40 100 38
             Q 150 40 144 90
             Q 142 65 128 58
             Q 120 72 108 60
             Q 100 74 90 60
             Q 78 72 70 58
             Q 58 66 56 90 Z" fill="#1c1a22"/>
    <path d="M 58 78 Q 54 100 60 112 Q 55 95 58 78 Z" fill="#1c1a22"/>
    <path d="M 142 78 Q 146 100 140 112 Q 145 95 142 78 Z" fill="#1c1a22"/>

    <!-- eyebrows -->
    <path d="M 76 84 Q 84 80 92 84" stroke="#2a2620" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 108 84 Q 116 80 124 84" stroke="#2a2620" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- eyes -->
    <ellipse cx="84" cy="93" rx="4.2" ry="5" fill="#241f1a"/>
    <ellipse cx="116" cy="93" rx="4.2" ry="5" fill="#241f1a"/>

    <!-- nose -->
    <path d="M 100 92 Q 96 104 100 108 Q 104 108 102 103" stroke="#b8875e" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- mustache -->
    <path d="M 84 113 Q 92 108 100 111 Q 108 108 116 113 Q 110 116 100 115 Q 90 116 84 113 Z" fill="#1c1a22"/>

    <!-- mouth -->
    <path d="M 88 122 Q 100 128 112 122" stroke="#8a5638" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- subtle cheeks -->
    <ellipse cx="72" cy="104" rx="7" ry="5" fill="#e79a1a" opacity="0.18"/>
    <ellipse cx="128" cy="104" rx="7" ry="5" fill="#e79a1a" opacity="0.18"/>
  </g>

  <!-- ring border -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.15"/>
</svg>
