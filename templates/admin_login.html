<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Login</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117; --surface: #141a26; --border: #232b3d;
    --text: #e8ecf1; --muted: #7c8797; --amber: #f2b134;
  }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); font-family: "JetBrains Mono", monospace;
  }
  form {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 30px 26px; width: 280px;
  }
  h1 { font-size: 15px; margin: 0 0 18px; color: var(--amber); }
  input {
    width: 100%; padding: 9px 11px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 13.5px;
    margin-bottom: 12px;
  }
  button {
    width: 100%; padding: 9px; border-radius: 6px; border: none;
    background: var(--amber); color: var(--bg); font-weight: 700; font-family: inherit;
    cursor: pointer; font-size: 13.5px;
  }
  .error { color: #ff8080; font-size: 12.5px; margin-bottom: 10px; }
</style>
</head>
<body>
  <form method="POST">
    <h1>$ akshay admin --login</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="admin password" autofocus>
    <button type="submit">enter</button>
  </form>
</body>
</html>
